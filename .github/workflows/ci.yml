name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew assembleDebug test --stacktrace

      - name: Merged manifest must not request INTERNET
        run: |
          manifest=$(find app/build/intermediates/merged_manifest -name AndroidManifest.xml | head -n 1)
          if [ -z "$manifest" ]; then
            echo "::error::Merged manifest not found"
            exit 1
          fi
          # Match real <uses-permission> declarations only, not comments.
          if tr '\n' ' ' < "$manifest" | sed 's/<!--[^>]*-->//g' \
              | grep -Eq '<uses-permission[^>]*android:name="android\.permission\.INTERNET"'; then
            echo "::error file=$manifest::uses-permission android.permission.INTERNET found in merged manifest"
            exit 1
          fi
          echo "OK: no INTERNET permission in $manifest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: evil-permit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
